# Production on lab-100-18. Nginx Proxy Manager forwards studio.rcsl.online
# to 192.168.100.18:8040; Postgres is reachable only on the compose network.
# Run scripts/preflight.sh before every `up` (README.md, Deployment).
name: agent-studio

services:
  app:
    build: .
    image: agent-studio:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://studio:${POSTGRES_PASSWORD}@db:5432/agent_studio
      AUTH_URL: https://studio.rcsl.online
      AUTH_TRUST_HOST: "true"
    ports:
      # Nginx Proxy Manager runs in a bridged container and proxies to the
      # host's LAN address, so bind there rather than on every interface.
      - "${STUDIO_BIND:-192.168.100.18}:8040:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agent_studio
    volumes:
      - agent-studio-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d agent_studio"]
      interval: 5s
      retries: 10

networks:
  default:
    # Pinned, never left to Docker's address pool. On this host Docker's next
    # pick is 192.168.64.0/20, which covers the VPN clients (192.168.77.x):
    # replies to them go into the bridge and the host becomes unreachable. That
    # happened to OpenAI-Logs-Manager on 2026-10-27 and to this stack on
    # 2026-11-22; both times the network had to be removed from the BMC console.
    ipam:
      config:
        - subnet: ${STUDIO_SUBNET:?set STUDIO_SUBNET in .env to a subnet unused on this host}

volumes:
  agent-studio-db:
