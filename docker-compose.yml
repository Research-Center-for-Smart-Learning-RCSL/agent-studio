# Production on lab-100-18. Nginx Proxy Manager forwards studio.rcsl.online
# to host port 8040; Postgres is reachable only on the compose network.
services:
  app:
    build: .
    image: agent-studio:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://studio:${POSTGRES_PASSWORD}@db:5432/agent_studio
      AUTH_URL: https://studio.rcsl.online
      AUTH_TRUST_HOST: "true"
    ports:
      - "8040:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agent_studio
    volumes:
      - agent-studio-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d agent_studio"]
      interval: 5s
      retries: 10

volumes:
  agent-studio-db:
